[project]
name = "snipeit-mcp"
version = "1.8.0"
description = "MCP server for Snipe-IT inventory management system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "snipeit", "inventory", "asset-management", "ai"]
dependencies = [
    "fastmcp>=3.0.0,<4.0.0",
    "requests>=2.31.0",
    # Pinned to a fixed commit (was @main): a moving dependency on a foreign
    # repo is not acceptable in production. As of 2026-08-26 upstream main has
    # moved past this SHA (including a breaking httpx migration, snipeit-api
    # 0.2) — revisit deliberately when that migration is ready.
    "snipeit-api @ git+https://github.com/lfctech/snipeit-python-api@11cd643d6c961fe51ca91a5f9e1a688e5c9a4a30",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "responses>=0.23.0"]

[project.urls]
Homepage = "https://github.com/jameshgordy/snipeit-mcp"
Repository = "https://github.com/jameshgordy/snipeit-mcp"
Issues = "https://github.com/jameshgordy/snipeit-mcp/issues"

[project.scripts]
snipeit-mcp = "snipeit_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
asyncio_mode = "auto"
