name: Claude Code Review

# Automatic review of every PR opened from a branch in this repo. PRs from
# forks don't receive repository secrets on `pull_request`, so they're skipped
# here; comment "@claude review this" on them instead (see claude.yml).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow CLAUDE.md. Focus on, in order:

            1. Correctness bugs, especially Snipe-IT API mismatches: check every
               endpoint path, HTTP method and payload field against the Snipe-IT
               source (grokability/snipe-it `routes/api.php` and the Api
               controllers at the latest release tag), not against docs.
            2. Test quality: new/changed tools need tests asserting the exact
               endpoint and payload (`assert_called_with`), not just success.
            3. Security issues (token handling, auth modes, identity mapping).
            4. For release PRs: pyproject.toml version and CHANGELOG.md agree.

            Only report real problems. Use inline comments for specific lines
            and one short top-level summary. Skip style nitpicks and praise.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),WebFetch"
